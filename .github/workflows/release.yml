name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install system Qt runtime libs (needed to link the bundled binary)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libxkbcommon0 libdbus-1-3 libgl1 > /dev/null
      - name: Install test deps and run suite
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e . --no-deps
          python -m pytest tests/ -q
      - name: Install PyInstaller + PySide6
        run: python -m pip install --upgrade pip && pip install pyinstaller PySide6
      - name: Build all artifacts (.deb, tarball, portable, standalone binary)
        run: |
          chmod +x build-deb.sh build-all.sh build-standalone.sh
          ./build-all.sh --output-dir dist
          PYTHON=python3 ./build-standalone.sh dist
      - name: Publish GitHub Release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Debian/Ubuntu/Mint/Pop!_OS: `sudo apt install ./file-organizer_*_all.deb`
            No root? Grab the `-portable.tar.gz`, extract, run `./file-organizer-portable.sh`.
            See CHANGELOG.md for details.
