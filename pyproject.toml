[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "file-organizer"
version = "2.0.0"
description = "Organize files by category — modern Qt GUI + CLI for Linux"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Elshad Guliyev" }]
keywords = ["files", "organizer", "linux", "qt", "pyside6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
gui-qt = ["PySide6>=6.6"]
gui-tk = ["matplotlib"]
test = ["pytest>=7"]
all = ["PySide6>=6.6", "matplotlib", "pytest>=7"]

[project.scripts]
file-organizer = "file_organizer.cli:main"

[project.urls]
Homepage = "https://github.com/ell-shad/file-organizer"
Issues = "https://github.com/ell-shad/file-organizer/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
